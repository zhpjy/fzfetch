name: Build binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: fzfetch-linux-x86_64
            binary: fzfetch
          # ARM GitHub-hosted runner labels require repository plan access; replace with cross-compilation or self-hosted runners if unavailable.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: fzfetch-linux-aarch64
            binary: fzfetch
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: fzfetch-macos-aarch64
            binary: fzfetch
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: fzfetch-windows-x86_64.exe
            binary: fzfetch.exe
          # ARM GitHub-hosted runner labels require repository plan access; replace with cross-compilation or self-hosted runners if unavailable.
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: fzfetch-windows-aarch64.exe
            binary: fzfetch.exe

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* --clobber
          else
            gh release create "$TAG_NAME" dist/* --title "$TAG_NAME" --generate-notes
          fi
