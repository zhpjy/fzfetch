name: Build binaries

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: fzfetch-linux-x86_64
            binary: fzfetch
          # ARM GitHub-hosted runner labels require repository plan access; replace with cross-compilation or self-hosted runners if unavailable.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: fzfetch-linux-aarch64
            binary: fzfetch
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: fzfetch-macos-x86_64
            binary: fzfetch
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: fzfetch-macos-aarch64
            binary: fzfetch
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: fzfetch-windows-x86_64.exe
            binary: fzfetch.exe
          # ARM GitHub-hosted runner labels require repository plan access; replace with cross-compilation or self-hosted runners if unavailable.
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: fzfetch-windows-aarch64.exe
            binary: fzfetch.exe

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
